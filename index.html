<h1>VPS Backup</h1>
<p>VPS Backup 是供授权用户使用的个人服务器备份工具，通过 rclone 连接 Google Drive。它拟将用户明确授权的数据保存到用户选择的云盘文件夹，并在需要时读取以供恢复。</p>
<p class="note">目前项目处于测试阶段，仅完成虚构数据的上传与取回；正式数据备份和自动任务尚未部署。</p>
<h2>Google Drive 权限</h2>
<p>应用请求 Google Drive 的 <code>drive.file</code> 权限，用于访问本应用创建或用户明确选择并授权的文件，包括读取、创建、修改和删除。</p>
